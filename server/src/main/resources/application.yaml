spring:
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: strategy-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
    properties:
      client.dns.lookup: use_all_dns_ips
    listener:
      ack-mode: manual

app:
  kafka:
    topic:
      bybit15m: { name: market.bybit.15m, partitions: 3 }
      bybit1h: { name: market.bybit.1h, partitions: 3 }
      bybit4h: { name: market.bybit.4h, partitions: 3 }
      bybit1D: { name: market.bybit.1D, partitions: 3 }
      user: { name: settings.rsi, partitions: 3 }
      notification: { name: notification.send, partitions: 3 }
  scheduler:
    thread_pool_core_size: 25
    thread_pool_max_size: 100
    strategy-counts:
      pool-size: 2
      prefix: strategy-counts-
      reset-cron: "0 0 0 * * *"
  rsi:
    settings-loader:
      timeout: 10s
      retry-count: 3
      retry-backoff: 1s
      jitter-factor: 0.3
  timezone: Europe/Amsterdam

server:
  port: 8081

logging:
  level:
    root: info

services:
  screener-user:
    base-url: http://localhost:8080
    rsi-settings-uri: /api/v1/settings/rsi
    connect-timeout: 3s
    response-timeout: 12s
    read-timeout: 12
    write-timeout: 5
    retry-count: 3
    retry-backoff: 1s
    retry-max-backoff: 8s

---
spring:
  config:
    activate:
      on-cloud-platform: kubernetes

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  health:
    kafka:
      enabled: false

services:
  screener-user:
    base-url: http://screener-user.screener-user.svc.cluster.local